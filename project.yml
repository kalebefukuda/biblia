name: Biblia
options:
  bundleIdPrefix: com.kalebefukuda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Time de assinatura é escolhido no Xcode (Signing & Capabilities); não versionar.
    DEVELOPMENT_TEAM: ""
targets:
  Biblia:
    type: application
    platform: iOS
    sources:
      - Biblia
      - Shared
    info:
      path: Biblia/Info.plist
      properties:
        CFBundleDisplayName: Bíblia
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalebefukuda.biblia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BibliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BibliaTests
    dependencies:
      - target: Biblia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalebefukuda.biblia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Biblia:
    build:
      targets:
        Biblia: all
    test:
      targets:
        - BibliaTests
