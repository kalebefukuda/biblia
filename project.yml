name: Biblia
options:
  bundleIdPrefix: com.kalebefukuda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Time de assinatura é escolhido no Xcode (Signing & Capabilities); não versionar.
    DEVELOPMENT_TEAM: ""
targets:
  Biblia:
    type: application
    platform: iOS
    sources:
      - Biblia
      - Shared
    info:
      path: Biblia/Info.plist
      properties:
        CFBundleDisplayName: Bíblia
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kalebefukuda.biblia
            CFBundleURLSchemes: [biblia]
    dependencies:
      - target: BibliaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalebefukuda.biblia
        CODE_SIGN_ENTITLEMENTS: Biblia/Biblia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BibliaWidget:
    type: app-extension
    platform: iOS
    sources:
      - BibliaWidget
      - Shared
    info:
      path: BibliaWidget/Info.plist
      properties:
        CFBundleDisplayName: Bíblia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalebefukuda.biblia.widget
        CODE_SIGN_ENTITLEMENTS: BibliaWidget/BibliaWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  BibliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BibliaTests
    dependencies:
      - target: Biblia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kalebefukuda.biblia.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Biblia:
    build:
      targets:
        Biblia: all
    test:
      targets:
        - BibliaTests
